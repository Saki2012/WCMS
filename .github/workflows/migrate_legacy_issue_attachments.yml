name: Migrate Legacy Issue Attachments

on:
  push:
    branches:
      - Feature/Dev
    paths:
      - .github/workflows/migrate_legacy_issue_attachments.yml

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Feature Dev
        uses: actions/checkout@v4
        with:
          ref: Feature/Dev
          fetch-depth: 0

      - name: Migrate legacy issue attachments by title
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: Saki2012/WCMS
          TARGET_REPO: iteasygo/WCMS
          TARGET_BRANCH: Feature/Dev
          ATTACHMENT_ROOT: Docs/03_品質與驗證文件/02_QA測試/IssueAttachments
        run: |
          python3 - <<'PY'
          import json
          import mimetypes
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          source_repo = os.environ['SOURCE_REPO']
          target_repo = os.environ['TARGET_REPO']
          target_branch = os.environ['TARGET_BRANCH']
          attachment_root = Path(os.environ['ATTACHMENT_ROOT'])
          api_root = 'https://api.github.com'
          attachment_re = re.compile(r'https://github\.com/user-attachments/(?:assets|files)/[^\s<>"\')]+')

          def api(method, path, body=None):
              url = api_root + path
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read()
                  return json.loads(raw.decode('utf-8')) if raw else None

          def list_issues(repo):
              items = []
              page = 1
              while True:
                  data = api('GET', f'/repos/{repo}/issues?state=all&per_page=100&page={page}')
                  rows = [x for x in data if 'pull_request' not in x]
                  items.extend(rows)
                  if len(data) < 100:
                      break
                  page += 1
              return items

          def refs(body):
              return attachment_re.findall(body or '')

          def safe_component(value):
              value = re.sub(r'[\\/:*?"<>|]+', '_', value).strip().strip('.')
              value = re.sub(r'\s+', ' ', value)
              return value[:120] or 'untitled'

          def activity_score(issue):
              score = int(issue.get('comments') or 0) * 100
              if issue.get('state') == 'closed':
                  score += 20
              baseline = {'bug', 'story', 'feature', 'enhancement'}
              labels = {str(x.get('name', '')).strip().lower() for x in issue.get('labels', [])}
              score += 5 * len(labels - baseline)
              score += 3 * len(issue.get('assignees') or [])
              created = issue.get('created_at') or ''
              updated = issue.get('updated_at') or ''
              if created and updated and updated > created:
                  score += 1
              return score

          def choose_target(candidates):
              if len(candidates) == 1:
                  return candidates[0], 'unique-title/body match'
              scored = sorted(((activity_score(x), x) for x in candidates), key=lambda x: x[0], reverse=True)
              if scored and scored[0][0] > 0 and (len(scored) == 1 or scored[0][0] > scored[1][0]):
                  return scored[0][1], f'unique activity score {scored[0][0]}'
              return None, 'ambiguous duplicate title'

          def guess_extension(final_url, content_type):
              path = urllib.parse.urlparse(final_url).path
              suffix = Path(path).suffix.lower()
              if suffix and len(suffix) <= 8:
                  return suffix
              ctype = (content_type or '').split(';', 1)[0].strip().lower()
              return mimetypes.guess_extension(ctype) or '.bin'

          def download_public_attachment(url):
              # Do not send GH_TOKEN to github.com/S3. Source repository is intentionally public.
              req = urllib.request.Request(url, headers={'User-Agent': 'WCMS-Issue-Attachment-Migration/1.0'})
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = resp.read()
                  if not data:
                      raise RuntimeError(f'empty download: {url}')
                  return data, resp.geturl(), resp.headers.get('Content-Type')

          source_issues = list_issues(source_repo)
          target_issues = list_issues(target_repo)

          sources_by_title = {}
          targets_by_title = {}
          for item in source_issues:
              sources_by_title.setdefault(item['title'], []).append(item)
          for item in target_issues:
              targets_by_title.setdefault(item['title'], []).append(item)

          plans = []
          conflicts = []
          already_done = []

          for title, source_group in sources_by_title.items():
              target_group = targets_by_title.get(title, [])
              if not target_group:
                  continue

              for source in source_group:
                  source_refs = list(dict.fromkeys(refs(source.get('body'))))
                  if not source_refs:
                      continue

                  source_ref_set = set(source_refs)
                  matching_targets = []
                  for target in target_group:
                      target_body = target.get('body') or ''
                      old_hits = [u for u in source_refs if u in target_body]
                      if old_hits:
                          matching_targets.append(target)

                  if not matching_targets:
                      # If source refs are gone, target may already be migrated. Do not overwrite.
                      already_done.append(title)
                      continue

                  chosen, why = choose_target(matching_targets)
                  if not chosen:
                      conflicts.append({
                          'title': title,
                          'reason': why,
                          'target_numbers': [x['number'] for x in matching_targets],
                          'source_attachment_count': len(source_refs),
                      })
                      continue

                  plans.append({
                      'title': title,
                      'source': source,
                      'target': chosen,
                      'refs': source_refs,
                      'why': why,
                  })

          # A target issue must never be selected by more than one source issue.
          target_to_plans = {}
          for plan in plans:
              target_to_plans.setdefault(plan['target']['number'], []).append(plan)
          safe_plans = []
          for number, group in target_to_plans.items():
              if len(group) == 1:
                  safe_plans.append(group[0])
              else:
                  conflicts.append({
                      'title': group[0]['title'],
                      'reason': 'multiple source issues matched same target body',
                      'target_numbers': [number],
                      'source_attachment_count': sum(len(x['refs']) for x in group),
                  })

          replacements_by_target = {}
          downloaded = {}
          download_failures = []

          for plan in safe_plans:
              title = plan['title']
              folder = attachment_root / safe_component(title)
              folder.mkdir(parents=True, exist_ok=True)
              mapping = {}
              for idx, url in enumerate(plan['refs'], start=1):
                  if url in downloaded:
                      path = downloaded[url]
                      mapping[url] = path
                      continue
                  try:
                      data, final_url, ctype = download_public_attachment(url)
                      ext = guess_extension(final_url, ctype)
                      identifier = urllib.parse.urlparse(url).path.rstrip('/').split('/')[-1]
                      if '.' in identifier and '/files/' in url:
                          stem = safe_component(Path(identifier).stem)
                      else:
                          stem = safe_component(identifier)
                      filename = f'{idx:02d}-{stem}{ext}'
                      path = folder / filename
                      path.write_bytes(data)
                      downloaded[url] = path
                      mapping[url] = path
                      print(f'DOWNLOADED title={title!r} target={plan["target"]["number"]} path={path} bytes={len(data)}')
                  except Exception as exc:
                      download_failures.append({'title': title, 'url': url, 'error': str(exc)})
                      print(f'ERROR download {title!r} {url}: {exc}', file=sys.stderr)
              if mapping:
                  replacements_by_target[plan['target']['number']] = {
                      'title': title,
                      'mapping': mapping,
                      'body': plan['target'].get('body') or '',
                      'why': plan['why'],
                  }

          # Remove any target plan with an incomplete attachment download.
          failed_urls = {x['url'] for x in download_failures}
          for number in list(replacements_by_target):
              info = replacements_by_target[number]
              if any(url in failed_urls for url in info['mapping']):
                  replacements_by_target.pop(number, None)

          commit_sha = None
          if downloaded:
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', str(attachment_root)], check=True)
              diff = subprocess.run(['git', 'diff', '--cached', '--quiet'])
              if diff.returncode != 0:
                  subprocess.run(['git', 'commit', '-m', 'Docs QA：搬遷舊 Issue 附件'], check=True)
                  subprocess.run(['git', 'push', 'origin', f'HEAD:{target_branch}'], check=True)
              commit_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          updated = []
          update_failures = []
          if commit_sha:
              for number, info in replacements_by_target.items():
                  body = info['body']
                  changed = False
                  for old_url, path in info['mapping'].items():
                      if old_url not in body:
                          continue
                      encoded_path = urllib.parse.quote(path.as_posix(), safe='/')
                      new_url = f'https://github.com/{target_repo}/blob/{commit_sha}/{encoded_path}?raw=1'
                      body = body.replace(old_url, new_url)
                      changed = True
                  if not changed:
                      continue
                  try:
                      api('PATCH', f'/repos/{target_repo}/issues/{number}', {'body': body})
                      updated.append({'number': number, 'title': info['title'], 'why': info['why']})
                      print(f'UPDATED target={number} title={info["title"]!r} ({info["why"]})')
                      time.sleep(0.2)
                  except Exception as exc:
                      update_failures.append({'number': number, 'title': info['title'], 'error': str(exc)})
                      print(f'ERROR update target={number}: {exc}', file=sys.stderr)

          summary = {
              'source_issue_count': len(source_issues),
              'target_issue_count': len(target_issues),
              'safe_plan_count': len(safe_plans),
              'updated_issue_count': len(updated),
              'downloaded_unique_attachment_count': len(downloaded),
              'conflict_count': len(conflicts),
              'download_failure_count': len(download_failures),
              'update_failure_count': len(update_failures),
              'commit_sha': commit_sha,
              'updated': updated,
              'conflicts': conflicts,
              'download_failures': download_failures,
              'update_failures': update_failures,
          }
          Path('/tmp/issue_attachment_migration_summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          gh_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if gh_summary:
              with open(gh_summary, 'a', encoding='utf-8') as f:
                  f.write('## Legacy Issue Attachment Migration\n\n')
                  f.write(f'- Updated issues: {len(updated)}\n')
                  f.write(f'- Downloaded attachments: {len(downloaded)}\n')
                  f.write(f'- Title conflicts skipped: {len(conflicts)}\n')
                  f.write(f'- Download failures: {len(download_failures)}\n')
                  f.write(f'- Update failures: {len(update_failures)}\n')
                  if commit_sha:
                      f.write(f'- Attachment commit: `{commit_sha}`\n')
                  if conflicts:
                      f.write('\n### Skipped conflicts\n')
                      for item in conflicts:
                          f.write(f'- `{item["title"]}`: {item["reason"]}\n')

          if download_failures or update_failures:
              sys.exit(2)
          PY

      - name: Remove one-time migration workflow
        if: success()
        run: |
          git rm .github/workflows/migrate_legacy_issue_attachments.yml
          git commit -m "Chore QA：移除一次性 Issue 附件搬遷工具"
          git push origin HEAD:Feature/Dev
