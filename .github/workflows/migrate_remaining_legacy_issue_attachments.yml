name: Migrate Remaining Legacy Issue Attachments

on:
  push:
    branches:
      - Feature/Dev
    paths:
      - .github/workflows/migrate_remaining_legacy_issue_attachments.yml

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Feature/Dev
          fetch-depth: 0

      - name: Migrate remaining duplicate-title issue attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, mimetypes, os, re, subprocess, time, urllib.parse, urllib.request
          from pathlib import Path

          SOURCE_REPO = 'Saki2012/WCMS'
          TARGET_REPO = 'iteasygo/WCMS'
          TARGET_BRANCH = 'Feature/Dev'
          ROOT = Path('Docs/03_品質與驗證文件/02_QA測試/IssueAttachments')
          TITLES = [
              '[Spec1819] 首頁的Shortcut Item如果是超連結，點開後沒有自動切換Link的大圖',
              '[Spec1819] 首頁的Shortcut Item應可顯示六筆',
              '[Spec1819] 首頁的Shortcut Item屬於超連結時 Icon大小不對',
          ]
          TOKEN = os.environ['GH_TOKEN']
          RE = re.compile(r'https://github\.com/user-attachments/(?:assets|files)/[^\s<>"\')]+')

          def api(method, path, body=None):
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode()
              req = urllib.request.Request('https://api.github.com' + path, data=data, method=method)
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('Authorization', f'Bearer {TOKEN}')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read()
                  return json.loads(raw.decode()) if raw else None

          def all_issues(repo):
              out=[]
              for page in range(1,10):
                  rows=api('GET', f'/repos/{repo}/issues?state=all&per_page=100&page={page}')
                  out.extend(x for x in rows if 'pull_request' not in x)
                  if len(rows)<100: break
              return out

          def safe(s):
              return re.sub(r'[\\/:*?"<>|]+','_',s).strip()[:120]

          def download(url):
              req=urllib.request.Request(url, headers={'User-Agent':'WCMS-Issue-Attachment-Migration/1.0'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  b=r.read(); final=r.geturl(); ct=r.headers.get('Content-Type','')
              if not b: raise RuntimeError('empty attachment')
              ext=Path(urllib.parse.urlparse(final).path).suffix.lower()
              if not ext: ext=mimetypes.guess_extension(ct.split(';')[0]) or '.bin'
              return b, ext

          src_all=all_issues(SOURCE_REPO)
          dst_all=all_issues(TARGET_REPO)
          plans=[]
          for title in TITLES:
              src=[x for x in src_all if x['title']==title]
              dst=[x for x in dst_all if x['title']==title]
              if len(src)!=1:
                  raise RuntimeError(f'{title}: expected exactly one source, got {len(src)}')
              canonical=[x for x in dst if x.get('state_reason')!='duplicate']
              duplicates=[x for x in dst if x.get('state_reason')=='duplicate']
              if len(canonical)!=1 or not duplicates:
                  raise RuntimeError(f'{title}: cannot uniquely resolve canonical target by exact title + duplicate state')
              refs=list(dict.fromkeys(RE.findall(src[0].get('body') or '')))
              if len(refs)!=2:
                  raise RuntimeError(f'{title}: expected 2 source attachments, got {len(refs)}')
              body=canonical[0].get('body') or ''
              if not all(u in body for u in refs):
                  raise RuntimeError(f'{title}: canonical target body does not contain exact source attachment URLs')
              plans.append((title, canonical[0], refs))

          mappings=[]
          for title,target,refs in plans:
              folder=ROOT/safe(title); folder.mkdir(parents=True, exist_ok=True)
              mp={}
              for i,u in enumerate(refs,1):
                  data,ext=download(u)
                  ident=urllib.parse.urlparse(u).path.rstrip('/').split('/')[-1]
                  p=folder/f'{i:02d}-{safe(Path(ident).stem)}{ext}'
                  p.write_bytes(data); mp[u]=p
                  print(f'DOWNLOADED title={title!r} bytes={len(data)} path={p}')
              mappings.append((title,target,mp))

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(ROOT)],check=True)
          subprocess.run(['git','commit','-m','Docs QA：補遷重複標題 Issue 附件'],check=True)
          subprocess.run(['git','push','origin',f'HEAD:{TARGET_BRANCH}'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()

          for title,target,mp in mappings:
              body=target.get('body') or ''
              for old,p in mp.items():
                  path=urllib.parse.quote(p.as_posix(),safe='/')
                  new=f'https://github.com/{TARGET_REPO}/blob/{sha}/{path}?raw=1'
                  body=body.replace(old,new)
              api('PATCH',f'/repos/{TARGET_REPO}/issues/{target["number"]}',{'body':body})
              print(f'UPDATED canonical title={title!r}')
              time.sleep(.2)

          print(json.dumps({'updated_issue_count':len(mappings),'attachment_count':sum(len(x[2]) for x in mappings),'commit_sha':sha},ensure_ascii=False))
          PY

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/migrate_remaining_legacy_issue_attachments.yml
          git commit -m "Chore QA：移除重複標題附件補遷工具"
          git push origin HEAD:Feature/Dev
