  data_contract: ["OpenAPI", "ApiResponse", "nullable", "optional", "DateOnly", "UTC", "LibField", "LibStr", "LibNum", "Persistence Validation", "Schema Drift", "IFormFile"]
  runtime_state: ["cache", "token state", "permission", "output cache", "multi-tab", "shared state", "browser session", "last activity", "refresh race", "atomic rotation", "LB", "Redis", "SaaS membership", "cart state"]
  customization: ["Feature", "Spec", "fallback", "slot", "override"]
