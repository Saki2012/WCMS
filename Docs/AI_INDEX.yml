    - "確認 Security Hardening、Error Handling、Validation、FileManagement 與弱掃入口可由本索引定位"
    - "確認白箱入口與 RULE_REGISTRY.yml 可由本索引定位"
    - "確認 QA README 與 WCMS-QA-GOV-001 可由本索引定位"
    - "確認本索引只提供定位，不與正式 Markdown、品質紀錄或 Rule Registry 衝突"
