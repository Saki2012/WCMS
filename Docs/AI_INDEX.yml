reading_order:
  - "Docs/WCMS_AI資料讀取入口.md"
  - "Docs/README.md"
  - "Docs/AI_INDEX.yml"
  - "Docs/01_研發與技術文件/01_系統架構/01_整體專案架構.md"
  - "依任務閱讀前端或後端專案架構"
  - "涉及 CSP、Security Header、SSR Host、COEP/COOP/CORP、Trusted Types 或 IIS→Node SSR→Backend 安全責任時，閱讀 02_前端專案架構.md 的 Security Hardening 章節並核對實際 Security 模組"
  - "涉及弱掃可重現 500、Exception 分類、DB Conflict、Dynamic Query 或 ErrorHandlingMiddleware 時，閱讀 03_後端專案架構.md 的 Auditing 與 Error Handling 章節"
  - "涉及 LibField／LibStr／LibNum、SaveChanges 最終驗證、Model/DB Schema Drift 或必要 IFormFile Upload 時，同時核對 FeatureDriver Model Validation、Persistence Validation 與 PlatformServices/FileManagement"
  - "涉及登入、多分頁、同裝置 Browser Shared State、SaaS Membership 或購物車時，核對 01_整體專案架構.md 與 02_前端專案架構.md 的 Shared State／Auth Session 契約"
  - "涉及 Refresh Token Rotation、Refresh Race、LB 或 Redis Token State 時，追加核對 03_後端專案架構.md 的 IAM／Refresh Rotation 契約"
  - "Docs/01_研發與技術文件/02_開發規範/01_共通開發規範.md"
  - "依任務閱讀前端或後端開發規範"
  - "弱點掃描任務追加閱讀 03_品質與驗證文件/03_弱掃報告/README.md、修改歷史與方針.md 與對應版本 README"
  - "白箱任務追加閱讀 AI 白箱 README、RULE_REGISTRY.yml 與對應檢測規範"
  - "Shared State／Multi-Tab 白箱追加閱讀 Topics/BrowserSharedState.md"
  - "QA 任務追加閱讀 QA README 與 WCMS-QA-GOV-001 正式生命週期"
  - "核對指定分支的實際程式碼、Issue、PR 與 Commit"

