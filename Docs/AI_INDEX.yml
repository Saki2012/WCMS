path_patterns:
  frontend_feature_api: "WCMS_Frontend/src/Features/Hooks/BizFunc/<DOMAIN>/<FEATURE>_Api.ts"
  frontend_client_feature: "WCMS_Frontend/src/Features/Pages/Client/BizFunc/<DOMAIN>/<FEATURE>/"
  frontend_server_feature: "WCMS_Frontend/src/Features/Pages/Server/BizFunc/<DOMAIN>/<FEATURE>/"
  frontend_spec: "WCMS_Frontend/src/SpecFetures/<SPEC_CODE>/ 或 WCMS_Frontend/src/SpecFeatures/<SPEC_CODE>/"
  backend_feature: "WCMS_Backend/Features/<DOMAIN>/<FEATURE>/"
  backend_feature_files:
    - "<FEATURE>_Model.cs"
    - "<FEATURE>_Biz.cs"
    - "<FEATURE>_Api.cs"
  backend_spec: "WCMS_Backend/SpecFeatures/<SPEC_CODE>/"

search_sequence:
  - "先用功能名稱、PGID、Model 名稱、API Route 或錯誤訊息搜尋。"
  - "搜尋 Feature 的既有 Model、Biz、API、Hook、Loader、Component 與 Adapter。"
  - "搜尋 SysCore、Library、Helper、Template、FeatureDriver、Service 與 Repository 的共用能力。"
  - "搜尋目前 Spec 與相近 Spec 的延伸實作，但不得直接複製客製邏輯。"
  - "涉及 Cookie、Session、Refresh、SaaS Membership、Cart 或其他共享 State 時，建立 Tab／Browser／Backend Scope Map。"
  - "涉及 Refresh Rotation 時，追蹤 Frontend Single-flight／跨 Tab Coordination，並一路追到 Backend old RTID Atomic Guarantee。"
  - "涉及 LB／Redis Token State 時，確認 Process-local Lock 不被誤當 Distributed Guarantee，並核對 Redis Required／Fail Closed 契約。"
  - "白箱任務依 RULE_REGISTRY.yml 篩選 active Rule，並核對其正式來源與適用範圍。"
  - "QA 任務依 WCMS-QA-GOV-001 核對 Issue 歷史、版本鏈、修正與複驗證據。"
  - "搜尋相關 Issue、PR 與 Commit，確認修改原因及歷史決策。"
  - "資料來源不一致時分別列出程式實況、文件規範、管理狀態及建議更新來源。"

risk_tags:
  accessibility: ["AA", "keyboard", "focus", "ARIA", "CMS content"]
  rendering: ["SSR", "CSR", "hydration", "loader", "browser API"]
  security: ["weakness scan", "CSP", "XSRF", "CORS", "JWT", "cookie", "refresh rotation"]
  data_contract: ["OpenAPI", "ApiResponse", "nullable", "optional", "DateOnly", "UTC"]
  runtime_state: ["cache", "token state", "permission", "output cache", "multi-tab", "shared state", "browser session", "refresh race", "atomic rotation", "LB", "Redis", "SaaS membership", "cart state"]
  customization: ["Feature", "Spec", "fallback", "slot", "override"]
  localization: ["route language", "Accept-Language", "i18n", "multilingual data"]
  auditing: ["operation log", "change log", "NLog", "transaction"]

legacy_compatibility:
  - path: "WCMS_Frontend/src/SpecFetures"
    note: "歷史拼字仍在相容範圍內；未完成全專案遷移前不得直接移除。"
  - topic: "REST and GraphQL"
    note: "目前 REST 為主線；GraphQL 套件存在不代表後端 GraphQL 主線已完成。"

maintenance:
  update_when:
    - "正式入口、主要目錄或核心檔案路徑變更"
    - "Feature／Spec 根目錄或命名規則變更"
    - "新的正式文件入口建立或舊入口移除"
    - "白箱 Rule Registry 或檢測模式入口變更"
    - "QA 生命週期、正式文件入口或版本狀態變更"
  do_not_duplicate:
    - "架構說明"
    - "Code Style"
    - "功能完成狀態"
    - "套件精確版本"
    - "測試或弱點掃描結果"
    - "Rule 的完整判斷內容"
    - "QA 生命週期的完整流程與欄位定義"
  verification:
    - "確認所有列出的檔案與目錄仍存在於指定分支"
    - "確認 README 與 AI 入口仍能導向本索引"
    - "確認白箱入口與 RULE_REGISTRY.yml 可由本索引定位"
    - "確認 QA README 與 WCMS-QA-GOV-001 可由本索引定位"
    - "確認本索引只提供定位，不與正式 Markdown 或 Rule Registry 衝突"
